<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Signing in...</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --foreground-color-primary: #2a2a3a;
        --foreground-color-muted: #6b6b80;
        --font-size: 0.95rem;
        --background-card: rgba(255, 255, 255, 0.55);
        --background-card-border: rgba(255, 255, 255, 0.7);
        --link-color: #4a5fc1;
        --gap-global: 1.1rem;
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --foreground-color-primary: #e6e6f0;
          --foreground-color-muted: #a0a0b8;
          --background-card: rgba(20, 20, 30, 0.55);
          --background-card-border: rgba(255, 255, 255, 0.12);
          --link-color: #9bb0ff;
        }
      }
      html, body {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      body {
        background-image: radial-gradient(circle at 20% 80%, rgba(255, 140, 140, 0.5), transparent 42%),
          radial-gradient(circle at 80% 20%, rgba(140, 200, 255, 0.55), transparent 42%),
          radial-gradient(circle at 40% 40%, rgba(255, 230, 140, 0.45), transparent 32%),
          linear-gradient(135deg, rgba(160, 120, 240, 0.95), rgba(120, 160, 240, 0.95));
        background-size: cover;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Verdana, Helvetica, Arial, sans-serif;
        font-size: var(--font-size);
        color: var(--foreground-color-primary);
        overflow: hidden;
      }
      .card {
        background: var(--background-card);
        border: 1px solid var(--background-card-border);
        border-radius: var(--radius);
        padding: 3rem 2.5rem;
        width: min(440px, calc(100% - 2rem));
        box-sizing: border-box;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        display: flex;
        flex-direction: column;
        align-items: center;
        row-gap: var(--gap-global);
        text-align: center;
      }
      .card p {
        margin: 0;
      }
      .status {
        display: flex;
        flex-direction: column;
        align-items: center;
        row-gap: 1rem;
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        opacity: 0.55;
      }
      .icon-fail {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #d9534f;
        color: #fff;
        font-size: 1.1rem;
        line-height: 28px;
        font-weight: 600;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          border-right-color: currentColor;
          opacity: 0.4;
        }
      }
      .hint {
        color: var(--foreground-color-muted);
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .link {
        color: var(--link-color);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.15s ease;
      }
      .link:hover {
        border-bottom-color: currentColor;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
<body>
  <div class="card">
    <div id="success">
      <div class="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>Redirecting</span>
      </div>
      <div class="hint">
        Not redirected? <a id="success-link" class="link" href="{{SSO_SUCCESS_URL}}">click here</a>
      </div>
      <noscript>
        <div class="hint">
          JavaScript is disabled. <a id="success-link-noscript" class="link" href="{{SSO_SUCCESS_URL}}">Continue manually</a>
        </div>
      </noscript>
    </div>
    <div id="failure" class="hidden" role="alert">
      <div class="status">
        <span class="icon-fail" aria-hidden="true">!</span>
        <span>Authentication failed</span>
      </div>
      <div id="failure-retry" class="hint">
        Please try again. <a id="failure-link" class="link" href="{{SSO_FAILURE_URL}}">Return to login</a>
      </div>
      <div id="failure-fatal" class="hint hidden">
        Something went wrong and we cannot redirect you. Please close this window and try again, or contact support.
      </div>
    </div>
  </div>
  <script>
  (function() {
    // Only http(s) URLs are allowed; anything else (javascript:, data:,
    // vbscript:, ...) is rejected to prevent the server-rendered URL from
    // becoming an XSS or open-redirect sink.
    function isSafeUrl(value) {
      if (typeof value !== 'string' || value === '') return false;
      try {
        const parsed = new URL(value, window.location.href);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    function neutralize(id) {
      const el = document.getElementById(id);
      if (el) el.removeAttribute('href');
    }

    function showFailure(fatal) {
      document.title = 'Sign-in failed';
      document.getElementById('success').classList.add('hidden');
      document.getElementById('failure').classList.remove('hidden');
      if (fatal) {
        document.getElementById('failure-retry').classList.add('hidden');
        document.getElementById('failure-fatal').classList.remove('hidden');
      }
    }

    const successUrl = '{{SSO_SUCCESS_URL}}';
    const failureUrl = '{{SSO_FAILURE_URL}}';
    const successOk = isSafeUrl(successUrl);
    const failureOk = isSafeUrl(failureUrl);

    if (!successOk) {
      neutralize('success-link');
    }
    if (!failureOk) {
      neutralize('failure-link');
    }

    if (!successOk) {
      showFailure(!failureOk);
      return;
    }

    try {
      // TOKEN mode requires localStorage — there is no session cookie
      // fallback, so without it the redirect would land unauthenticated.
      if (typeof localStorage !== 'object' || typeof localStorage.setItem !== 'function') {
        console.error('localStorage not supported; cannot persist token');
        showFailure(!failureOk);
        return;
      }
      localStorage.setItem('{{SESSION_DATA_KEY}}', '{{SESSION_DATA_VALUE}}');
      localStorage.setItem('{{SESSION_EXPIRY_KEY}}', '{{SESSION_EXPIRY_VALUE}}');
      location.href = successUrl;
    }
    catch (e) {
      console.error('Redirect failed:', e);
      showFailure(!failureOk);
    }
  })();
  </script>
</body>
</html>
